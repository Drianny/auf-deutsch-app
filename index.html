

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auf Deutsch! Comprehensive Mobile Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-[100dvh] w-full flex flex-col justify-between p-4 font-sans overflow-hidden select-none">

    <!-- TOP HEADER UTILITY BAR -->
    <header class="w-full max-w-sm mx-auto flex justify-between items-center flex-shrink-0 py-1">
        <div>
            <h1 class="text-base font-black tracking-tight text-white">AUF DEUTSCH!</h1>
            <p id="totalCounter" class="text-[9px] text-zinc-500 font-mono uppercase tracking-widest mt-0.5">Inventory: 0 words</p>
        </div>
        <button onclick="toggleSettings()" class="bg-zinc-900 border border-zinc-800 text-zinc-400 px-3 py-1.5 rounded-xl text-[11px] font-bold hover:text-white transition">
            ⚙️ Setup
        </button>
    </header>

    <!-- COLLAPSIBLE SETTINGS PANEL -->
    <div id="settingsPanel" class="hidden w-full max-w-sm mx-auto bg-zinc-900 border border-zinc-800 p-3 rounded-2xl my-1 space-y-2 flex-shrink-0 z-50">
        <div>
            <label class="block text-[9px] text-zinc-400 font-bold uppercase mb-1">OpenAI Secret API Key</label>
            <input type="password" id="apiKey" placeholder="sk-proj-..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-xs text-white outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="generateAIVocabBatch('Nouns')" id="genNounBtn" class="bg-zinc-800 border border-zinc-700 text-emerald-400 font-bold py-1.5 rounded-xl text-[10px] transition">
                + 20 B1 Nouns
            </button>
            <button onclick="generateAIVocabBatch('Verbs & Adjectives')" id="genVerbBtn" class="bg-zinc-800 border border-zinc-700 text-teal-400 font-bold py-1.5 rounded-xl text-[10px] transition">
                + 20 Verbs & Adj
            </button>
            <button onclick="generateAIVocabBatch('Prepositions & Conjunctions (like ob, obwohl, durch, während)')" id="genConjBtn" class="bg-zinc-800 border border-zinc-700 text-indigo-400 font-bold py-1.5 rounded-xl text-[10px] transition">
                + Prep & Conj
            </button>
            <button onclick="generateAIVocabBatch('Time Expressions, Question Words & Pronouns (like jemanden, gestern, warum, wer)')" id="genTimeBtn" class="bg-zinc-800 border border-zinc-700 text-amber-400 font-bold py-1.5 rounded-xl text-[10px] transition">
                + Time & Q-Words
            </button>
        </div>
    </div>

    <!-- MAIN VIEWS -->
    <main class="w-full max-w-sm mx-auto flex-1 flex items-center justify-center min-h-0 py-2">
        
        <!-- COMPACT 3D CARD BOX -->
        <div id="flashcardContainer" class="w-full h-full max-h-[380px] aspect-[3/4] perspective-1000 hidden">
            <div id="cardFlipper" class="w-full h-full transform-style-3d transition-transform duration-700 relative">
                
                <!-- CARD FACE FRONT -->
                <div id="cardFront" class="absolute inset-0 bg-gradient-to-b from-zinc-900 to-zinc-925 border border-zinc-800 rounded-[28px] p-6 flex flex-col justify-between items-center backface-hidden shadow-xl">
                    <div class="w-full flex justify-between items-center text-[9px] font-mono tracking-wider text-zinc-500">
                        <span id="cardBadge" class="uppercase bg-zinc-800 px-2 py-0.5 rounded-full text-zinc-400">NOMEN</span>
                        <span id="queueProgress">0/0</span>
                    </div>

                    <div class="w-full text-center space-y-3 my-auto overflow-hidden">
                        <div id="visualVectorPlaceholder" class="w-14 h-14 mx-auto bg-emerald-500/5 border border-emerald-500/10 rounded-full flex items-center justify-center text-2xl shadow-inner select-none">
                            🇩🇪
                        </div>
                        <h2 id="deWord" class="text-2xl font-black tracking-tight text-white break-words px-1 max-w-full leading-tight"></h2>
                        <p id="deDetails" class="text-[11px] text-zinc-400 font-medium truncate px-2"></p>
                    </div>

                    <div class="w-full space-y-2">
                        <div class="h-1 bg-zinc-800 rounded-full overflow-hidden w-2/3 mx-auto">
                            <div id="timelineProgress" class="h-full bg-emerald-400 w-0 transition-all duration-300"></div>
                        </div>
                        <p id="loopIndicator" class="text-[9px] font-mono text-zinc-600 text-center uppercase tracking-widest truncate">2s Pause...</p>
                    </div>
                </div>

                <!-- CARD FACE REVERSE -->
                <div class="absolute inset-0 bg-zinc-900 border border-zinc-800 rounded-[28px] p-6 flex flex-col justify-between items-center backface-hidden rotate-y-180 shadow-xl">
                    <span class="text-[9px] font-mono tracking-widest text-indigo-400 uppercase bg-indigo-500/10 px-2.5 py-0.5 rounded-full">Bedeutung</span>
                    
                    <div class="text-center space-y-1 my-auto w-full overflow-hidden">
                        <h3 id="enWord" class="text-2xl font-black tracking-tight text-indigo-300 break-words px-1 max-w-full leading-tight"></h3>
                        <p class="text-[10px] text-zinc-500 italic">Auto-advancing...</p>
                    </div>

                    <div class="w-10 h-0.5 bg-zinc-800 rounded-full"></div>
                </div>

            </div>
        </div>

        <!-- IDLE STARTING DASHBOARD LAYOUT -->
        <div id="idleDisplay" class="w-full text-center space-y-4 px-4 py-8 bg-zinc-900/40 border border-zinc-900 rounded-[28px]">
            <div class="text-2xl">🎯</div>
            <div>
                <h4 id="welcomeTitle" class="text-sm font-bold text-white uppercase tracking-wide">Daily Queue Ready</h4>
                <p class="text-[11px] text-zinc-500 max-w-[200px] mx-auto mt-1 leading-normal">Spaced repetition deck covering all core grammar categories.</p>
            </div>
            <button onclick="startSession()" class="bg-white text-black font-bold text-xs tracking-tight px-6 py-2.5 rounded-full hover:bg-zinc-200 transition shadow-md">
                Start Audio Loop
            </button>
        </div>

    </main>

    <!-- FIXED LOWER FOOTER DOCK -->
    <footer class="w-full max-w-sm mx-auto flex justify-center flex-shrink-0 py-1">
        <button id="manualTriggerBtn" onclick="startManualSession()" class="text-[10px] font-bold text-zinc-600 tracking-wider uppercase hover:text-zinc-400 transition">
            🔄 Manual Full Deck Review
        </button>
    </footer>

    <script>
        const defaultSet = [
            { id: 1, type: "nomen", article: "die", singular: "Entscheidung", plural: "Entscheidungen", english: "decision", icon: "⚖️", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 2, type: "konjunktion", article: "", singular: "obwohl", plural: "", english: "although", icon: "🔄", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 3, type: "konjunktion", article: "", singular: "ob", plural: "", english: "whether / if", icon: "❓", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 4, type: "pronomen", article: "", singular: "jemanden", plural: "", english: "someone (accusative)", icon: "👤", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 5, type: "adverb", article: "", singular: "trotzdem", plural: "", english: "nevertheless / anyway", icon: "🛡️", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 6, type: "fragewort", article: "", singular: "warum", plural: "", english: "why", icon: "❓", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 7, type: "nomen", article: "der", singular: "Zusammenhang", plural: "Zusammenhänge", english: "context / connection", icon: "🔗", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 8, type: "verb", article: "", singular: "empfehlen", plural: "", english: "to recommend", icon: "👍", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 9, type: "adjektiv", article: "", singular: "abhängig", plural: "", english: "dependent", icon: "⏳", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 10, type: "zeitangabe", article: "", singular: "gestern", plural: "", english: "yesterday", icon: "📅", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 11, type: "präposition", article: "", singular: "durch", plural: "", english: "through / by", icon: "🚪", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 12, type: "nomen", article: "das", singular: "Ergebnis", plural: "Ergebnisse", english: "result", icon: "📊", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 13, type: "verb", article: "", singular: "verhindern", plural: "", english: "to prevent", icon: "🛑", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 14, type: "adjektiv", article: "", singular: "erfolgreich", plural: "", english: "successful", icon: "🌟", dateScheduled: new Date().toISOString().split('T')[0] },
            { id: 15, type: "zeitangabe", article: "", singular: "während", plural: "", english: "during", icon: "⏱️", dateScheduled: new Date().toISOString().split('T')[0] }
        ];

        let database = JSON.parse(localStorage.getItem('de_comprehensive_core_db')) || defaultSet;
        if(!localStorage.getItem('de_comprehensive_core_db')) {
            localStorage.setItem('de_comprehensive_core_db', JSON.stringify(database));
        }

        document.getElementById('apiKey').value = localStorage.getItem('open_ai_key') || '';
        document.getElementById('apiKey').addEventListener('input', (e) => {
            localStorage.setItem('open_ai_key', e.target.value);
        });

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('hidden');
        }

        function updateDisplayCounters() {
            document.getElementById('totalCounter').innerText = `Inventory: ${database.length} words`;
        }

        function scheduleNewBatch(items) {
            let targetDate = new Date();
            if(database.length > defaultSet.length) {
                const dates = database.map(c => new Date(c.dateScheduled));
                targetDate = new Date(Math.max(...dates));
                targetDate.setDate(targetDate.getDate() + 1);
            }

            let dailyTracker = 0;
            items.forEach(w => {
                if(targetDate.getDay() === 0) targetDate.setDate(targetDate.getDate() + 1);

                database.push({
                    id: Date.now() + Math.random(),
                    type: w.type || 'nomen',
                    article: w.article || '',
                    singular: w.singular,
                    plural: w.plural || '',
                    english: w.english,
                    icon: w.icon || '📖',
                    dateScheduled: targetDate.toISOString().split('T')[0]
                });

                dailyTracker++;
                if(dailyTracker >= 5) {
                    dailyTracker = 0;
                    targetDate.setDate(targetDate.getDate() + 1);
                }
            });

            localStorage.setItem('de_comprehensive_core_db', JSON.stringify(database));
            updateDisplayCounters();
        }

        async function generateAIVocabBatch(categoryGroup) {
            const apiKey = document.getElementById('apiKey').value;
            if(!apiKey) return alert("Please configure your OpenAI API Key in Setup first.");

            const activeBtn = event.target;
            const originalText = activeBtn.innerText;
            activeBtn.disabled = true; 
            activeBtn.innerText = "Generating...";

            // Gather all current singular words to strictly block duplication
            const existingWords = database.map(item => item.singular.toLowerCase());

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        response_format: { type: "json_object" },
                        messages: [{
                            role: "system",
                            content: "You output JSON matching array signature: {'words': [{'type': 'nomen/verb/adjektiv/konjunktion/präposition/pronomen/fragewort/zeitangabe', 'article': 'der/die/das or empty string', 'singular': 'german word', 'plural': 'plural form or empty string', 'english': 'exact english translation', 'icon': 'single descriptive emoji'}]}. Populate exactly 20 unique intermediate items."
                        }, { 
                            role: "user", 
                            content: `Provide 20 unique high-yield German vocabulary cards for this category: ${categoryGroup}. CRITICAL: Do NOT include any words matching this exclusion list already in my database: ${JSON.stringify(existingWords)}` 
                        }]
                    })
                });
                const data = await response.json();
                const parsed = JSON.parse(data.choices.message.content);
                
                // Double check client-side filtering to prevent duplicates
                const filteredWords = parsed.words.filter(w => !existingWords.includes(w.singular.toLowerCase()));

                scheduleNewBatch(filteredWords);
                alert(`Successfully added ${filteredWords.length} new unique items!`);
            } catch(e) {
                alert("API key limit or network error.");
                console.error(e);
            } finally {
                activeBtn.disabled = false; 
                activeBtn.innerText = originalText;
            }
        }

        function extractWorkingQueue(isManual) {
            if(isManual) return database;
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];

            if(today.getDay() === 0) {
                return database.filter(c => {
                    const delta = Math.ceil(Math.abs(today - new Date(c.dateScheduled)) / (1000 * 60 * 60 * 24));
                    return delta <= 7;
                });
            }

            const pastDate = new Date();
            pastDate.setDate(today.getDate() - 2);
            const pastStr = pastDate.toISOString().split('T')[0];

            return database.filter(c => c.dateScheduled === todayStr || c.dateScheduled === pastStr);
        }

        function vocalizeEngine(phrase) {
            return new Promise((res) => {
                window.speechSynthesis.cancel();
                const speakToken = new SpeechSynthesisUtterance(phrase);
                speakToken.lang = 'de-DE';
                speakToken.rate = 0.85;
                speakToken.onend = () => res();
                window.speechSynthesis.speak(speakToken);
            });
        }

        function startManualSession() { startSession(true); }

        async function startSession(forceManual = false) {
            const queue = extractWorkingQueue(forceManual);
            const idleSpace = document.getElementById('idleDisplay');
            const targetWorkspace = document.getElementById('flashcardContainer');
            const flipper = document.getElementById('cardFlipper');
            const timeline = document.getElementById('timelineProgress');
            const cardFront = document.getElementById('cardFront');

            if(queue.length === 0) {
                document.getElementById('welcomeTitle').innerText = "All Clear! 🎉";
                return;
            }

            document.getElementById('settingsPanel').classList.add('hidden');
            idleSpace.classList.add('hidden');
            targetWorkspace.classList.remove('hidden');

            for(let index = 0; index < queue.length; index++) {
                const card = queue[index];
                
                flipper.classList.remove('rotate-y-180');
                document.getElementById('queueProgress').innerText = `${index + 1}/${queue.length}`;
                document.getElementById('cardBadge').innerText = card.type;
                document.getElementById('visualVectorPlaceholder').innerText = card.icon || '🇩🇪';
                
                // Color coding based on noun gender article or general type
                cardFront.className = "absolute inset-0 border rounded-[28px] p-6 flex flex-col justify-between items-center backface-hidden shadow-xl transition-all duration-300 " + 
                    (card.article === 'der' ? 'bg-gradient-to-b from-blue-950/40 to-zinc-900 border-blue-900/50' : 
                     card.article === 'die' ? 'bg-gradient-to-b from-rose-950/30 to-zinc-900 border-rose-900/50' : 
                     card.article === 'das' ? 'bg-gradient-to-b from-emerald-950/30 to-zinc-900 border-emerald-900/50' : 
                     'bg-gradient-to-b from-zinc-900 to-zinc-925 border-zinc-800');

                if(card.type === 'nomen' && card.article) {
                    document.getElementById('deWord').innerText = `${card.article.toUpperCase()} ${card.singular}`;
                    document.getElementById('deDetails').innerText = `Plural: die ${card.plural || '—'}`;
                } else {
                    document.getElementById('deWord').innerText = card.singular.toUpperCase();
                    document.getElementById('deDetails').innerText = `Typ: ${card.type}`;
                }
                document.getElementById('enWord').innerText = card.english;

                // Step 1: Front look buffer (2 seconds)
                document.getElementById('loopIndicator').innerText = "Card Flash...";
                timeline.style.width = "25%";
                await new Promise(r => setTimeout(r, 2000));

                // Step 2: Audio Loop (3 repetitions x 2 seconds post audio)
                const voicePrompt = (card.article ? `${card.article} ${card.singular}` : card.singular);
                for(let loop = 1; loop <= 3; loop++) {
                    document.getElementById('loopIndicator').innerText = `Listen Loop ${loop}/3`;
                    timeline.style.width = `${25 + (loop * 15)}%`;
                    
                    await vocalizeEngine(voicePrompt);
                    await new Promise(r => setTimeout(r, 2000));
                }

                // Step 3: 3D Flip
                document.getElementById('loopIndicator').innerText = "Flipping...";
                timeline.style.width = "100%";
                flipper.classList.add('rotate-y-180');

                // Step 4: Verification look (3.5 seconds)
                await new Promise(r => setTimeout(r, 3500));
            }

            targetWorkspace.classList.add('hidden');
            idleSpace.classList.remove('hidden');
            document.getElementById('welcomeTitle').innerText = "Session Complete!";
        }

        updateDisplayCounters();
    </script>
</body>
</html>
